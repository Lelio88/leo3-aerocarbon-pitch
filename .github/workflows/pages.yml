# Déploie le diaporama (racine du dépôt) sur GitHub Pages à chaque push sur main.
# Site statique, aucune étape de build : on publie les fichiers tels quels.
name: Déployer le diaporama

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deux jobs, comme le modèle officiel : l'artefact envoyé dans un job n'est pas toujours
  # visible par l'API dans ce même job (« Found 0 artifact(s) »).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
